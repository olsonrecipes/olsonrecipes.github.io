<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Olson Family Table</title>
<style>
:root { --paper:#F6EFE3; --card:#FFFDF8; --ink:#2B2420; --muted:#6B5D52; --brick:#9C3D26; --rule:#D9CBB4; }
@media (prefers-color-scheme: dark) { :root { --paper:#1F1A16; --card:#2A231E; --ink:#F1E8DA; --muted:#BBAA95; --brick:#E08B6E; --rule:#4A3F35; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--paper); color:var(--ink);
       font-family: 'Helvetica Neue', Arial, sans-serif; padding: 24px 16px; }
form { width:100%; max-width:380px; background:var(--card); border:1px solid var(--rule); border-top:4px solid var(--brick); padding:32px 28px; text-align:center; border-radius:4px; box-shadow:0 10px 28px rgba(0,0,0,.08); }
h1 { font-family: Georgia, 'Times New Roman', serif; font-weight:400; font-size:32px; line-height:1.05; margin:0 0 6px; }
h1 i { color: var(--brick); }
p { color:var(--muted); margin:0 0 22px; font-size:15px; }
label { display:block; text-align:left; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
input { width:100%; height:46px; border:1px solid var(--rule); border-radius:23px; padding:0 18px; font-size:17px; background:var(--paper); color:var(--ink); }
button { margin-top:14px; width:100%; height:46px; border:0; border-radius:23px; background:var(--brick); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
#err { color:var(--brick); min-height:22px; margin-top:12px; font-size:14px; }
input:focus-visible, button:focus-visible { outline:2px solid var(--brick); outline-offset:2px; }
</style></head>
<body>
<form id="f" autocomplete="on">
  <h1>The Olson Family <i>Table</i></h1>
  <p>Recipes from our table. Enter the family password to come in.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button type="submit" id="go">Open the cookbook</button>
  <div id="err" role="alert"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const STORE = 'olson-table-key';
async function deriveRaw(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim().toLowerCase()), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(BLOB.s), iterations: BLOB.n, hash: 'SHA-256' }, base, 256));
}
async function openWith(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BLOB.i) }, key, b64(BLOB.c));
  const rawB64 = btoa(String.fromCharCode(...raw));
  const inject = '<script>window.__OLSON_KEY=' + JSON.stringify(rawB64) + ';window.__OLSON_ENC=true;<\/script>';
  const html = new TextDecoder().decode(plain).replace('</head>', inject + '</head>');
  document.open(); document.write(html); document.close();
}
(async () => {

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.textContent = 'Opening…'; err.textContent = '';
  try {
    const raw = await deriveRaw(document.getElementById('pw').value);
    try { localStorage.setItem(STORE, btoa(String.fromCharCode(...raw))); } catch (_) {}
    await openWith(raw);
  } catch (x) {
    try { localStorage.removeItem(STORE); } catch (_) {}
    btn.textContent = 'Open the cookbook';
    err.textContent = 'That password didn\u2019t work. Check the spelling and try again.';
  }
});
